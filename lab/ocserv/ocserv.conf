auth = "plain[passwd=/etc/ocserv/passwd,otp=/etc/ocserv/users.otp]"
tcp-port = 443
socket-file = /run/ocserv.socket
server-cert = /lab/certs/server.crt
server-key = /lab/certs/server.key
isolate-workers = false
max-clients = 32
max-same-clients = 0
# every login adds ban points here; would lock the lab client out
max-ban-score = 0
keepalive = 32400
dpd = 90
mobile-dpd = 1800
try-mtu-discovery = false
tls-priorities = "NORMAL:%SERVER_PRECEDENCE"
auth-timeout = 240
cookie-timeout = 300
deny-roaming = false
rekey-time = 172800
rekey-method = ssl
use-occtl = true
pid-file = /run/ocserv.pid
device = vpns
predictable-ips = true
default-domain = rwtest
ipv4-network = 192.168.99.0
ipv4-netmask = 255.255.255.0
cisco-client-compat = true
dtls-legacy = true
config-per-group = /etc/ocserv/groups/
select-group = full[RWTH-VPN (Full Tunnel)]
select-group = split[RWTH-VPN (Split Tunnel)]
